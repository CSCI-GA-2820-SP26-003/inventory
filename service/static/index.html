<!DOCTYPE html>
<html>
  <head>
    <title>Inventory Service</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="static/images/newapp-icon.png">
    <link rel="stylesheet" href="static/css/cerulean_bootstrap.min.css">
  </head>
  <body>
    <div class="container">
      <div class="page-header">
          <h1>Inventory REST API Service</h1>
      </div>

      <!-- Flash Message -->
      <div class="table-responsive">
        <table class="table">
          <tr><td>Status:</td><td><span id="flash_message"></span></td></tr>
        </table>
      </div>

      <!-- FORM -->
      <div class="col-md-12" id="form_data">
        <h3>Create, Retrieve, Update, and Delete an Inventory Item:</h3>
        <div class="well">
          <div class="form-horizontal">
            <div class="form-group">
              <label class="control-label col-sm-2" for="item_id">Item ID:</label>
              <div class="col-sm-6">
                <input type="text" class="form-control" id="item_id" placeholder="Enter ID of Inventory Item">
              </div>
              <div class="col-sm-4">
                <button type="submit" class="btn btn-primary" id="retrieve-btn">Retrieve</button>
                <button type="submit" class="btn btn-danger" id="delete-btn">Delete</button>
              </div>
            </div>
          </div> <!-- form horizontal -->

          <div class="form-horizontal">

            <!-- PRODUCT ID -->
            <div class="form-group">
              <label class="control-label col-sm-2" for="item_product_id">Product ID:</label>
              <div class="col-sm-10">
                <input type="text" class="form-control" id="item_product_id" placeholder="Enter Product ID">
              </div>
            </div>

            <!-- CONDITION -->
            <div class="form-group">
              <label class="control-label col-sm-2" for="item_condition">Condition:</label>
              <div class="col-sm-10">
                <select class="form-control" id="item_condition">
                  <option value="NEW" selected>New</option>
                  <option value="OPEN_BOX">Open Box</option>
                  <option value="USED">Used</option>
                </select>
              </div>
            </div>

            <!-- QUANTITY -->
            <div class="form-group">
              <label class="control-label col-sm-2" for="item_quantity">Quantity:</label>
              <div class="col-sm-10">
                <input type="number" class="form-control" id="item_quantity" placeholder="Enter Quantity">
              </div>
            </div>

            <!-- RESTOCK LEVEL -->
            <div class="form-group">
              <label class="control-label col-sm-2" for="item_restock_level">Restock Level:</label>
              <div class="col-sm-10">
                <input type="number" class="form-control" id="item_restock_level" placeholder="Enter Restock Level">
              </div>
            </div>

            <!-- RESTOCK AMOUNT -->
            <div class="form-group">
              <label class="control-label col-sm-2" for="item_restock_amount">Restock Amount:</label>
              <div class="col-sm-10">
                <input type="number" class="form-control" id="item_restock_amount" placeholder="Enter Restock Amount">
              </div>
            </div>


            <!-- SUBMIT BUTTONS -->
            <div class="form-group">
              <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary" id="search-btn">Search</button>
                <button type="submit" class="btn btn-primary" id="clear-btn">Clear</button>
                <button type="submit" class="btn btn-success" id="create-btn">Create</button>
                <button type="submit" class="btn btn-warning" id="update-btn">Update</button>
              </div>
            </div>
          </div> <!-- form horizontal -->
        </div> <!-- end well -->
      </div> <!-- end Form -->

      <!-- Search Results -->
      <div class="table-responsive col-md-12" id="search_results">
        <table class="table table-striped">
          <thead>
          <tr>
            <th class="col-md-2">ID</th>
            <th class="col-md-2">Product ID</th>
            <th class="col-md-2">Condition</th>
            <th class="col-md-2">Quantity</th>
            <th class="col-md-2">Restock Level</th>
            <th class="col-md-2">Restock Amount</th>
          </tr>
          </thead>
        </table>
      </div>

      <footer>
        <br><br>
        <p>&copy; NYU DevOps Company 2026</p>
      </footer>

    </div> <!-- container -->

  <script type="text/javascript" src = "static/js/jquery-3.6.0.min.js"></script>
  <script type="text/javascript" src = "static/js/bootstrap.min.js"></script>

  <!-- YOUR REST API -->
  <script type="text/javascript" src="static/js/rest_api.js"></script>

  </body>
</html>
