<!DOCTYPE html>
<html>
  <head>
    <title>Inventory Service</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="static/images/newapp-icon.png">
    <link rel="stylesheet" href="static/css/cerulean_bootstrap.min.css">
  </head>
  <body>
    <div class="container">
      <div class="page-header">
          <h1>Inventory REST API Service</h1>
      </div>

      <!-- Flash Message -->
      <div class="table-responsive">
        <table class="table">
          <tr><td>Status:</td><td><span id="flash_message"></span></td></tr>
        </table>
      </div>

      <div class="col-md-12" id="form_data">

        <!-- Item Details Panel -->
        <div class="panel panel-default">
          <div class="panel-heading"><h4 class="panel-title">Item Details</h4></div>
          <div class="panel-body">
            <div class="form-horizontal">

              <div class="form-group">
                <label class="control-label col-sm-2" for="item_id">Item ID:</label>
                <div class="col-sm-7">
                  <input type="text" class="form-control" id="item_id" placeholder="Enter ID of Inventory Item">
                </div>
                <div class="col-sm-3">
                  <div class="btn-group">
                    <button class="btn btn-default" id="retrieve-btn">Retrieve</button>
                    <button class="btn btn-danger" id="delete-btn">Delete</button>
                  </div>
                </div>
              </div>

              <div class="form-group">
                <label class="control-label col-sm-2" for="item_product_id">Product ID:</label>
                <div class="col-sm-10">
                  <input type="text" class="form-control" id="item_product_id" placeholder="Enter Product ID">
                </div>
              </div>

              <div class="form-group">
                <label class="control-label col-sm-2" for="item_condition">Condition:</label>
                <div class="col-sm-10">
                  <select class="form-control" id="item_condition">
                    <option value="" selected>Any</option>
                    <option value="NEW">New</option>
                    <option value="OPEN_BOX">Open Box</option>
                    <option value="USED">Used</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label class="control-label col-sm-2" for="item_quantity">Quantity:</label>
                <div class="col-sm-10">
                  <input type="number" class="form-control" id="item_quantity" placeholder="Enter Quantity">
                </div>
              </div>

              <div class="form-group">
                <label class="control-label col-sm-2" for="item_restock_level">Restock Level:</label>
                <div class="col-sm-10">
                  <input type="number" class="form-control" id="item_restock_level" placeholder="Enter Restock Level">
                </div>
              </div>

              <div class="form-group">
                <label class="control-label col-sm-2" for="item_restock_amount">Restock Amount:</label>
                <div class="col-sm-10">
                  <input type="number" class="form-control" id="item_restock_amount" placeholder="Enter Restock Amount">
                </div>
              </div>

              <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                  <button class="btn btn-success" id="create-btn">Create</button>
                  <button class="btn btn-primary" id="update-btn">Update</button>
                  <button class="btn btn-default" id="restock-btn">Restock</button>
                </div>
              </div>

            </div>
          </div>
        </div>

        <!-- Search & Filter Panel -->
        <div class="panel panel-default">
          <div class="panel-heading"><h4 class="panel-title">Search &amp; Filter</h4></div>
          <div class="panel-body">
            <p class="text-muted" style="margin-left:16.66%">Product ID and Condition from the form above are included in search.</p>
            <div class="form-horizontal">

              <div class="form-group">
                <label class="control-label col-sm-2">Quantity Range:</label>
                <div class="col-sm-4">
                  <input type="number" class="form-control" id="filter_quantity_min" placeholder="Min">
                  <span class="text-danger" id="err_quantity"></span>
                </div>
                <div class="col-sm-4">
                  <input type="number" class="form-control" id="filter_quantity_max" placeholder="Max">
                </div>
              </div>

              <div class="form-group">
                <label class="control-label col-sm-2">Restock Level Range:</label>
                <div class="col-sm-4">
                  <input type="number" class="form-control" id="filter_restock_level_min" placeholder="Min">
                  <span class="text-danger" id="err_restock_level"></span>
                </div>
                <div class="col-sm-4">
                  <input type="number" class="form-control" id="filter_restock_level_max" placeholder="Max">
                </div>
              </div>

              <div class="form-group">
                <label class="control-label col-sm-2">Restock Amount Range:</label>
                <div class="col-sm-4">
                  <input type="number" class="form-control" id="filter_restock_amount_min" placeholder="Min">
                  <span class="text-danger" id="err_restock_amount"></span>
                </div>
                <div class="col-sm-4">
                  <input type="number" class="form-control" id="filter_restock_amount_max" placeholder="Max">
                </div>
              </div>

              <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                  <button class="btn btn-primary" id="search-btn">Search</button>
                  <button class="btn btn-default" id="list_all-btn">List All</button>
                  <button class="btn btn-default" id="clear-btn">Clear</button>
                </div>
              </div>

            </div>
          </div>
        </div>

      </div> <!-- end form_data -->

      <!-- Search Results -->
      <div class="table-responsive col-md-12" id="search_results">
        <table class="table table-striped">
          <thead>
          <tr>
            <th class="col-md-1">ID</th>
            <th class="col-md-2">Product ID</th>
            <th class="col-md-2">Condition</th>
            <th class="col-md-1">Quantity</th>
            <th class="col-md-2">Restock Level</th>
            <th class="col-md-2">Restock Amount</th>
            <th class="col-md-1">Edit</th>
            <th class="col-md-1">Decrement</th>
          </tr>
          </thead>
        </table>
      </div>

      <footer>
        <br><br>
        <p>&copy; NYU DevOps Company 2026</p>
      </footer>

    </div> <!-- container -->

  <script type="text/javascript" src = "static/js/jquery-3.6.0.min.js"></script>
  <script type="text/javascript" src = "static/js/bootstrap.min.js"></script>

  <!-- YOUR REST API -->
  <script type="text/javascript" src="static/js/rest_api.js"></script>

  </body>
</html>
